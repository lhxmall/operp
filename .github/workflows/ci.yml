name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace || true

  js-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install aa-testkit deps (for AA complexity gate)
        run: npm install --prefix vendor/aa-testkit --no-audit --no-fund || npm install --prefix vendor/aa-testkit
      - run: node obyte-local/tools/check_aa_complexity.js obyte-local/agents/operp_vault.aa obyte-local/agents/operp_rollup.aa obyte-local/agents/operp_dispute.aa obyte-local/agents/operp_dispute_fill.aa
      - run: node obyte-local/golden_vector_check.js

  e2e:
    runs-on: ubuntu-latest
    # Full devnet E2E compiles rocksdb/sqlite3 (~5-8 min). Runs on every push
    # AND on PRs so a broken AA/test pairing is caught BEFORE merging to main.
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native deps (needs build-essential, already on ubuntu-latest)
        run: |
          npm install --prefix vendor/aa-testkit --no-audit --no-fund
          npm install --prefix obyte-local --no-audit --no-fund
      - name: Regenerate fixture
        run: cargo run -p operp-settle --example gen_withdraw_proof -- I6X2KSUJJJC5D5T6ARVT7OH5Z7XMSMYG 2000000 0 1000000
      - name: Run AA devnet E2E
        run: node obyte-local/test_settlement_aa.js
