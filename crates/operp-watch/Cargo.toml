[package]
name = "operp-watch"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Independent OPERP vault-AA watcher: replays da_unit batches and flags root mismatches"

[[bin]]
name = "operp-watch"
path = "src/main.rs"

[dependencies]
operp-types = { path = "../operp-types" }
operp-dag = { path = "../operp-dag" }
operp-exec = { path = "../operp-exec" }
operp-state = { path = "../operp-state" }
operp-settle = { path = "../operp-settle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
ed25519-dalek = "3"
operp-types = { path = "../operp-types" }
