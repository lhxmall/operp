[workspace]
resolver = "2"
members = [
  "crates/operp-types",
  "crates/operp-book",
  "crates/operp-account",
  "crates/operp-dag",
  "crates/operp-state",
  "crates/operp-exec",
  "crates/operp-settle",
  "crates/operp-gossip",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
thiserror = "1"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
operp-types = { path = "crates/operp-types" }
operp-book = { path = "crates/operp-book" }
operp-account = { path = "crates/operp-account" }
operp-dag = { path = "crates/operp-dag" }
operp-state = { path = "crates/operp-state" }
operp-exec = { path = "crates/operp-exec" }
operp-gossip = { path = "crates/operp-gossip" }
operp-settle = { path = "crates/operp-settle" }

[profile.release]
lto = "thin"
codegen-units = 1
